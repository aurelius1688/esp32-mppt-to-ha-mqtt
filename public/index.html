<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="author" content="Aurelius1688 晴若晓溪">
<meta name="description" content="ESP32 MPPT 太阳能控制器实时监控面板">
<meta name="mppt-ui-build" content="2026-11-13-stable">
<title>晴若晓溪 MPPT</title>
<link rel="icon" href="icon.ico">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script>
  try { if (localStorage.getItem('mppt-theme') === 'light') document.documentElement.classList.add('light'); } catch(e){}
</script>
<style>
:root{
  color-scheme:dark;
  --bg:#060910;
  --panel:rgba(15,23,38,.72);
  --panel-2:rgba(20,30,48,.58);
  --line:rgba(148,163,184,.15);
  --line-soft:rgba(148,163,184,.09);
  --text:#e9f0fb;
  --muted:#8c9bb5;
  --cyan:#42e8c6;--cyan-2:#9cf7e5;
  --blue:#63a8ff;--orange:#ffb45c;--red:#ff6b7a;--lime:#b8ff6a;--violet:#a78bfa;
  --gap:14px;--pad:18px;--radius:20px;--radius-sm:13px;
  --chart-tick:#94a3b8;--chart-grid:rgba(148,163,184,.12);--chart-label:#94a3b8;--chart-h:220px;
}
html.light{
  color-scheme:light;
  --bg:#eef3fb;--panel:rgba(255,255,255,.80);--panel-2:rgba(255,255,255,.64);
  --line:rgba(15,23,42,.12);--line-soft:rgba(15,23,42,.07);
  --text:#0f172a;--muted:#5d6b84;
  --cyan:#089e86;--cyan-2:#0f766e;
  --blue:#2563eb;--orange:#d97706;--red:#dc2626;--lime:#65a30d;--violet:#7c3aed;
  --chart-tick:#64748b;--chart-grid:rgba(15,23,42,.08);--chart-label:#475569;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{min-height:100%}
body{
  font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;transition:background .25s,color .25s;
}
body::before{
  content:"";position:fixed;inset:-20%;z-index:-2;pointer-events:none;
  background:
    radial-gradient(42% 38% at 14% 4%,rgba(66,232,198,.19),transparent 70%),
    radial-gradient(36% 34% at 88% 8%,rgba(99,168,255,.18),transparent 70%),
    radial-gradient(44% 42% at 70% 95%,rgba(167,139,250,.13),transparent 70%),
    radial-gradient(30% 30% at 35% 70%,rgba(255,180,92,.08),transparent 70%);
  filter:blur(16px);transition:opacity .25s;
}
body::after{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.32;
  background-image:linear-gradient(rgba(148,163,184,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(148,163,184,.06) 1px,transparent 1px);
  background-size:48px 48px;
  mask-image:radial-gradient(ellipse at 50% 20%,#000 20%,transparent 72%);
  -webkit-mask-image:radial-gradient(ellipse at 50% 20%,#000 20%,transparent 72%);
}
html.light body::before{
  opacity:.95;
  background:
    radial-gradient(42% 38% at 14% 4%,rgba(8,158,134,.14),transparent 70%),
    radial-gradient(36% 34% at 88% 8%,rgba(37,99,235,.12),transparent 70%),
    radial-gradient(44% 42% at 70% 95%,rgba(124,58,237,.09),transparent 70%),
    radial-gradient(30% 30% at 35% 70%,rgba(217,119,6,.06),transparent 70%);
}
html.light body::after{opacity:.5;background-image:linear-gradient(rgba(15,23,42,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(15,23,42,.06) 1px,transparent 1px)}

/* ══ 顶栏 ══ */
.header{
  position:sticky;top:0;z-index:40;
  background:linear-gradient(155deg,rgba(15,23,38,.88),rgba(20,30,48,.72));
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-bottom:1px solid var(--line);padding:14px 20px;
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px 16px;
  transition:background .25s,border-color .25s;
}
html.light .header{background:linear-gradient(155deg,rgba(255,255,255,.92),rgba(255,255,255,.78))}
.header > a{text-decoration:none;color:inherit;display:flex;align-items:center;min-width:0;justify-self:start}
.header h1{font-size:17px;font-weight:700;line-height:1.2;letter-spacing:.2px;display:flex;align-items:center;gap:10px;white-space:nowrap;margin:0}
.header h1 svg{width:26px;height:26px;flex-shrink:0;filter:drop-shadow(0 4px 14px rgba(66,232,198,.25))}
.header-weather{
  justify-self:center;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;line-height:1;
  font-size:12px;color:var(--text);padding:7px 13px;border-radius:999px;border:1px solid var(--line);
  background:rgba(15,23,38,.66);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  transition:background .25s,border-color .25s,opacity .2s;
}
html.light .header-weather{background:rgba(255,255,255,.72)}
.header-weather .weather-icon{color:var(--orange);font-size:15px}
.header-weather .weather-text{font-weight:700;color:var(--orange);font-size:12.5px}
.header-weather .weather-temp{font-weight:700;color:var(--blue);font-size:12.5px}
.header-weather .weather-sub{font-size:11px;color:var(--muted)}
.header-weather.off{opacity:.5}
.header-actions{justify-self:end;display:flex;gap:9px;align-items:center;min-width:0}
.status-bar{display:flex;gap:8px;font-size:11.5px;color:var(--muted);align-items:center}
.status-bar > span{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;border:1px solid var(--line);
  background:rgba(15,23,38,.66);white-space:nowrap;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:background .25s,border-color .25s}
html.light .status-bar > span{background:rgba(255,255,255,.72)}
.status-bar > span > i{font-size:11px;opacity:.75}
#lastUpdate{display:inline-block;min-width:5.6em;text-align:center;font-variant-numeric:tabular-nums}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex:none;transition:all .2s}
.dot.online{background:var(--cyan);box-shadow:0 0 0 4px rgba(66,232,198,.14),0 0 14px rgba(66,232,198,.8);animation:pulse 2s infinite}
.dot.offline{background:var(--red);box-shadow:0 0 0 4px rgba(255,107,122,.12)}
@keyframes pulse{50%{opacity:.5;transform:scale(.82)}}
.header-actions button,.icon-btn{
  background:rgba(15,23,38,.66);border:1px solid var(--line);color:var(--muted);cursor:pointer;font-size:15px;
  padding:7px 10px;border-radius:999px;transition:background .2s,border-color .2s,color .2s,transform .2s;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:grid;place-items:center;line-height:1;flex:none;
}
html.light .header-actions button,html.light .icon-btn{background:rgba(255,255,255,.72)}
.header-actions button:hover,.icon-btn:hover{background:rgba(66,232,198,.12);border-color:rgba(66,232,198,.34);color:var(--cyan);transform:rotate(8deg)}
.theme-toggle{width:36px;height:36px;border-radius:50%!important;padding:0!important}
.theme-toggle svg{width:17px;height:17px}
.theme-toggle .theme-moon{display:none}
html.light .theme-toggle .theme-sun{display:none}
html.light .theme-toggle .theme-moon{display:block}

/* ══ 容器 ══ */
.container{max-width:1400px;margin:0 auto;padding:20px;position:relative;z-index:1}

/* ══ 数据卡片 ══ */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:var(--gap);margin-bottom:20px}
.card{position:relative;overflow:hidden;background:linear-gradient(155deg,var(--panel),var(--panel-2));
  border-radius:var(--radius);padding:15px 16px 16px;border:1px solid var(--line);
  box-shadow:0 22px 60px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.055);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);transition:border-color .2s,box-shadow .2s,background .25s}
html.light .card{box-shadow:0 20px 50px rgba(15,23,42,.10),inset 0 1px 0 rgba(255,255,255,.9)}
.card::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;background:radial-gradient(120% 80% at 100% 0%,rgba(99,168,255,.07),transparent 44%)}
html.light .card::after{background:radial-gradient(120% 80% at 100% 0%,rgba(37,99,235,.05),transparent 44%)}
.card:hover{border-color:rgba(66,232,198,.30);box-shadow:0 26px 70px rgba(0,0,0,.34),inset 0 1px 0 rgba(255,255,255,.075)}
.card .label{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;
  display:flex;align-items:center;gap:6px;font-weight:600;position:relative;z-index:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .label i{font-size:11px;opacity:.9;flex:none}
.card .value{font-size:clamp(22px,2.8vw,30px);font-weight:800;letter-spacing:-.035em;line-height:1.05;
  font-variant-numeric:tabular-nums;position:relative;z-index:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .value .num{font-variant-numeric:tabular-nums}
.card .unit{font-size:11.5px;color:var(--muted);margin-left:4px;font-weight:600;letter-spacing:0}
.card.voltage .value{color:var(--blue);text-shadow:0 0 24px rgba(99,168,255,.22)}
.card.current .value{color:var(--cyan);text-shadow:0 0 24px rgba(66,232,198,.20)}
.card.power .value{color:var(--orange);text-shadow:0 0 24px rgba(255,180,92,.20)}
.card.temperature .value{color:var(--red);text-shadow:0 0 24px rgba(255,107,122,.18)}
.card.energy .value{color:var(--violet);text-shadow:0 0 24px rgba(167,139,250,.20)}
.card.measurement .value{color:var(--lime);text-shadow:0 0 24px rgba(184,255,106,.16)}

/* ══ 图表卡片 ══ */
.chart-box{position:relative;overflow:hidden;background:linear-gradient(155deg,var(--panel),var(--panel-2));
  border-radius:var(--radius);padding:16px 16px 14px;border:1px solid var(--line);
  box-shadow:0 22px 60px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.055);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);transition:background .25s,border-color .25s,box-shadow .25s}
html.light .chart-box{background:linear-gradient(155deg,rgba(255,255,255,.90),rgba(248,250,252,.72));box-shadow:0 20px 50px rgba(15,23,42,.10),inset 0 1px 0 rgba(255,255,255,.9)}
.chart-box::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;background:radial-gradient(120% 80% at 100% 0%,rgba(99,168,255,.07),transparent 44%)}
html.light .chart-box::after{background:radial-gradient(120% 80% at 100% 0%,rgba(37,99,235,.05),transparent 44%)}
.chart-box h3{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;font-weight:600;
  display:flex;align-items:center;gap:7px;position:relative;z-index:1}
.chart-box h3 i{font-size:13px}

/* ══ 趋势 / 月度控件 ══ */
.trend-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px;position:relative;z-index:1}
.trend-left{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.trend-date{font:inherit;font-size:12px;font-weight:700;color:var(--text);background:rgba(0,0,0,.24);border:1px solid var(--line);border-radius:8px;padding:6px 9px;cursor:pointer;outline:none}
html.light .trend-date{background:rgba(255,255,255,.88)}
.trend-date:hover{border-color:var(--cyan)}
.winseg{display:inline-flex;align-items:center;gap:2px;padding:2px;border:1px solid var(--line);border-radius:10px;background:rgba(0,0,0,.2)}
html.light .winseg{background:rgba(255,255,255,.6)}
.winseg button{border:0;background:none;color:var(--muted);font:inherit;font-size:11.5px;font-weight:700;padding:5px 9px;border-radius:7px;cursor:pointer;transition:.16s;white-space:nowrap;line-height:1.2}
.winseg button:hover{color:var(--text)}
.winseg button.on{background:var(--cyan);color:#06231d;box-shadow:0 2px 8px rgba(66,232,198,.3)}
html.light .winseg button.on{color:#fff}
.chip-sep{width:1px;height:18px;background:var(--line);margin:0 2px;align-self:center}
.trend-chips{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.chip{border:1px solid var(--line);background:rgba(0,0,0,.2);color:var(--text);border-radius:999px;padding:5px 11px;font-size:11.5px;font-weight:600;cursor:pointer;transition:.18s;white-space:nowrap;font-family:inherit}
html.light .chip{background:rgba(255,255,255,.6)}
.chip:hover{border-color:var(--cyan);transform:translateY(-1px)}
.chip.on{background:var(--cyan);border-color:var(--cyan);color:#06231d;box-shadow:0 4px 12px rgba(66,232,198,.3)}
html.light .chip.on{color:#fff}
.trend-chips .chip i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.trend-svg{display:block;width:100%;height:auto;cursor:crosshair;touch-action:pan-y;position:relative;z-index:1}
.trend-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px;position:relative;z-index:1}
.tstat{border:1px solid var(--line);border-radius:12px;padding:10px 13px;background:rgba(0,0,0,.14);position:relative;overflow:hidden}
html.light .tstat{background:rgba(255,255,255,.5)}
.tstat::before{content:"";position:absolute;left:0;top:0;right:0;height:3px;background:var(--c)}
.tstat .k{font-size:10.5px;color:var(--muted);letter-spacing:.04em}
.tstat .v{font-size:19px;font-weight:800;color:var(--c);margin-top:3px;font-variant-numeric:tabular-nums}
.tstat .v small{font-size:11px;font-weight:600;color:var(--muted);margin-left:4px}
.ax{fill:var(--muted);font-size:12px}
.axb{fill:var(--text);font-size:11.5px;font-weight:700}
.gridln{stroke:var(--line);stroke-width:1}
.future{fill:var(--panel-2);opacity:.55}
.pkbox{fill:var(--panel);stroke:var(--line)}
.hvbox{fill:var(--panel);stroke:var(--line);stroke-width:1;filter:drop-shadow(0 6px 14px rgba(15,23,42,.18))}
.hvtx{font-size:11.5px;font-weight:700;fill:var(--text)}
.hvtime{fill:var(--muted);font-size:10.5px;font-weight:700}
.pkmark{transition:opacity .12s}
.trend-svg.hovering .pkmark{opacity:0}
.trend-svg.hovering .mvaltext{opacity:0}
.empty-hint{fill:var(--muted);font-size:14px}
.mbar{transition:opacity .12s}
.mbar.dim{opacity:.32}
.mbar-today{stroke:var(--text);stroke-opacity:.8;stroke-width:1.8}
.mavg{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:6 5;opacity:.9}
.mvaltext{fill:var(--text);font-size:11.5px;font-weight:800;transition:opacity .12s}
.mempty{fill:var(--muted);opacity:.3}

/* ══ 信息卡片 ══ */
.info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:var(--gap);margin-bottom:20px}
.info-card{position:relative;overflow:hidden;background:linear-gradient(155deg,var(--panel),var(--panel-2));
  border-radius:var(--radius);padding:16px 18px 14px;border:1px solid var(--line);
  box-shadow:0 22px 60px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.055);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);transition:background .25s,border-color .25s}
html.light .info-card{box-shadow:0 20px 50px rgba(15,23,42,.10),inset 0 1px 0 rgba(255,255,255,.9)}
.info-card::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;background:radial-gradient(120% 80% at 100% 0%,rgba(99,168,255,.07),transparent 44%)}
html.light .info-card::after{background:radial-gradient(120% 80% at 100% 0%,rgba(37,99,235,.05),transparent 44%)}
.info-card h3{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;font-weight:600;
  display:flex;align-items:center;gap:7px;position:relative;z-index:1;min-height:24px}
.info-card h3 i{color:var(--cyan);font-size:13px;flex:none}
.info-card h3 > span{display:inline-flex;align-items:center;gap:7px}
.info-card h3 button{margin-left:auto!important;background:rgba(255,107,122,.14)!important;color:#ffb3bb!important;border:1px solid rgba(255,107,122,.32)!important;
  cursor:pointer;padding:3px 10px!important;border-radius:999px!important;font-size:10px!important;font-weight:700;letter-spacing:.04em;
  transition:background .2s,border-color .2s;display:inline-flex;align-items:center;gap:4px;flex:none}
html.light .info-card h3 button{background:rgba(220,38,38,.10)!important;color:#b91c1c!important;border-color:rgba(220,38,38,.28)!important}
.info-card h3 button:hover{background:rgba(255,107,122,.24)!important;border-color:rgba(255,107,122,.52)!important}
html.light .info-card h3 button:hover{background:rgba(220,38,38,.18)!important;border-color:rgba(220,38,38,.48)!important}
.info-card table{width:100%;font-size:12.5px;border-collapse:collapse;position:relative;z-index:1;table-layout:fixed}
.info-card td{padding:7px 0;border-bottom:1px solid var(--line-soft);vertical-align:middle;line-height:1.4}
.info-card td:first-child{color:var(--muted);padding-right:12px;width:42%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.info-card td:last-child{text-align:right;color:var(--text);font-weight:600;font-variant-numeric:tabular-nums;word-break:break-word;overflow-wrap:anywhere;width:58%}
.info-card tr:last-child td{border-bottom:0}

/* ══ 徽章 ══ */
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:10.5px;font-weight:700;letter-spacing:.04em;white-space:nowrap;transition:background .25s,color .25s,border-color .25s}
.badge i{font-size:10px}
.badge.ok{background:rgba(66,232,198,.12);color:var(--cyan-2);border:1px solid rgba(66,232,198,.28)}
.badge.err{background:rgba(255,107,122,.12);color:#ffb3bb;border:1px solid rgba(255,107,122,.30)}
.badge.on{background:rgba(99,168,255,.12);color:#a8cbff;border:1px solid rgba(99,168,255,.28)}
.badge.off{background:rgba(148,163,184,.10);color:var(--muted);border:1px solid var(--line)}
html.light .badge.ok{background:rgba(8,158,134,.12);color:#047857;border-color:rgba(8,158,134,.32)}
html.light .badge.err{background:rgba(220,38,38,.10);color:#b91c1c;border-color:rgba(220,38,38,.28)}
html.light .badge.on{background:rgba(37,99,235,.10);color:#1d4ed8;border-color:rgba(37,99,235,.28)}
html.light .badge.off{background:rgba(15,23,42,.06);color:var(--muted);border-color:var(--line)}

/* ══ Toast ══ */
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);z-index:999;max-width:calc(100vw - 32px);
  padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:rgba(15,23,38,.94);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:#e7effc;font-size:12.5px;
  box-shadow:0 16px 40px rgba(0,0,0,.38);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s,background .25s}
html.light .toast{background:rgba(255,255,255,.96);color:#0f172a;border-color:var(--line)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.success{border-color:rgba(66,232,198,.42);color:var(--cyan-2)}
.toast.error{border-color:rgba(255,107,122,.42);color:#ffd5da}
html.light .toast.success{color:#0f766e}
html.light .toast.error{color:#b91c1c}

/* ══ 遮罩 / 模态 ══ */
.overlay{display:none;position:fixed;inset:0;background:rgba(3,7,14,.68);z-index:100;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
html.light .overlay{background:rgba(15,23,42,.35)}
.overlay.open{display:flex;align-items:center;justify-content:center;padding:20px}
.modal{position:relative;background:linear-gradient(155deg,rgba(15,23,38,.94),rgba(20,30,48,.86));border:1px solid var(--line);
  border-radius:22px;padding:24px;width:100%;max-width:540px;max-height:90vh;overflow-y:auto;
  box-shadow:0 30px 80px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.06);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px)}
html.light .modal{background:linear-gradient(155deg,rgba(255,255,255,.96),rgba(255,255,255,.86));box-shadow:0 30px 80px rgba(15,23,42,.22),inset 0 1px 0 rgba(255,255,255,.9)}
.modal::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;background:radial-gradient(120% 80% at 100% 0%,rgba(99,168,255,.07),transparent 44%)}
.modal > *{position:relative;z-index:1}
.modal h2{font-size:17px;margin-bottom:18px;display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:.02em}
.modal h2 i{color:var(--cyan);font-size:16px}
.modal > h3{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:18px 0 10px;font-weight:600;display:flex;align-items:center;gap:7px}
.modal > h3 i{color:var(--cyan);font-size:12px}
.modal-sm{max-width:400px;text-align:center}
.modal-sm h2{justify-content:center}
.modal-sm .form-group{text-align:left}
.modal-sm .btn-group{justify-content:center}
.modal::-webkit-scrollbar{width:8px}
.modal::-webkit-scrollbar-track{background:transparent}
.modal::-webkit-scrollbar-thumb{background:rgba(148,163,184,.20);border-radius:999px}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:10.5px;letter-spacing:.1em;color:var(--muted);margin-bottom:5px;font-weight:600;text-transform:uppercase}
.form-group input,.form-group select{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);
  background:rgba(0,0,0,.24);color:var(--text);font-size:12.5px;outline:none;font-family:inherit;
  transition:border-color .2s,box-shadow .2s,background .2s;font-variant-numeric:tabular-nums}
html.light .form-group input,html.light .form-group select{background:rgba(255,255,255,.88)}
.form-group input::placeholder{color:rgba(140,155,181,.55)}
.form-group input:focus,.form-group select:focus{border-color:rgba(66,232,198,.44);box-shadow:0 0 0 3px rgba(66,232,198,.08);background:rgba(0,0,0,.30)}
html.light .form-group input:focus,html.light .form-group select:focus{background:rgba(255,255,255,.96);border-color:rgba(8,158,134,.44);box-shadow:0 0 0 3px rgba(8,158,134,.08)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.form-hint{font-size:10.5px;color:var(--muted);margin-top:5px;line-height:1.4;opacity:.85}
.btn-group{display:flex;gap:9px;margin-top:20px;flex-wrap:wrap}
.btn-group button{padding:10px 20px;border-radius:10px;border:1px solid var(--line);font-size:12.5px;cursor:pointer;
  transition:background .2s,border-color .2s,color .2s;font-weight:600;display:inline-flex;align-items:center;gap:7px;font-family:inherit}
.btn-primary{background:linear-gradient(135deg,rgba(66,232,198,.22),rgba(99,168,255,.14));border-color:rgba(66,232,198,.40);color:var(--cyan-2)}
.btn-primary:hover{background:linear-gradient(135deg,rgba(66,232,198,.32),rgba(99,168,255,.22));border-color:rgba(66,232,198,.60)}
.btn-primary:disabled{opacity:.45;cursor:not-allowed}
.btn-secondary{background:rgba(255,255,255,.03);color:var(--text)}
html.light .btn-secondary{background:rgba(255,255,255,.62)}
.btn-secondary:hover{background:rgba(255,255,255,.07);border-color:rgba(148,163,184,.30)}
html.light .btn-secondary:hover{background:rgba(255,255,255,.82)}
.test-result{font-size:11.5px;padding:8px 0;display:flex;align-items:center;gap:7px;line-height:1.4}
.test-result.ok{color:var(--cyan-2)}
.test-result.fail{color:#ffb3bb}
html.light .test-result.ok{color:#0f766e}
html.light .test-result.fail{color:#b91c1c}

/* ══ 响应式 ══ */
@media(max-width:1100px){
  .header{grid-template-columns:1fr auto;grid-template-rows:auto auto}
  .header > a{grid-column:1;grid-row:1}
  .header-actions{grid-column:2;grid-row:1}
  .header-weather{grid-column:1 / -1;grid-row:2;justify-self:center}
}
@media(max-width:768px){
  .cards{grid-template-columns:repeat(2,minmax(0,1fr))}
  .form-row{grid-template-columns:1fr}
  .container{padding:16px}
  .trend-stats{grid-template-columns:repeat(2,1fr)}
  :root{--chart-h:200px}
}
@media(max-width:640px){
  :root{--gap:12px;--radius:16px;--radius-sm:12px;--chart-h:180px}
  .header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 10px;padding:12px 14px}
  .header > a{order:1;flex:1 1 auto;min-width:0}
  .header h1{font-size:15.5px;gap:8px}
  .header h1 svg{width:23px;height:23px}
  .header-actions{display:contents}
  .header-actions button{order:2;flex:0 0 auto;font-size:14px;padding:6px 8px}
  .theme-toggle{width:32px;height:32px!important;padding:0!important}
  .theme-toggle svg{width:15px;height:15px}
  .header-weather{order:3;flex-basis:100%;justify-content:center;font-size:11px;padding:6px 11px;gap:6px;flex-wrap:wrap}
  .header-weather .weather-icon{font-size:13px}
  .header-weather .weather-text,.header-weather .weather-temp{font-size:11.5px}
  .header-weather .weather-sub{flex-basis:100%;font-size:10px;text-align:center}
  .header-actions > .status-bar{order:4;flex-basis:100%;justify-content:center;gap:6px;font-size:10.5px}
  .status-bar > span{padding:5px 9px;gap:5px}
  .status-bar > span > i{font-size:10px}
  .container{padding:14px 12px 32px}
  .cards{gap:10px}
  .card{padding:12px 13px 13px;border-radius:16px}
  .card .value{font-size:clamp(19px,5.5vw,24px)}
  .card .unit{font-size:11px;margin-left:3px}
  .card .label{font-size:9.5px;letter-spacing:.1em;margin-bottom:5px;gap:5px}
  .card .label i{font-size:10px}
  .chart-box{padding:14px 14px 10px;border-radius:16px}
  .chart-box h3{font-size:10px;margin-bottom:8px;gap:6px}
  .chart-box h3 i{font-size:11px}
  .trend-chips{justify-content:flex-start}
  .info-grid{gap:12px;margin-bottom:16px}
  .info-card{padding:14px 15px 12px;border-radius:16px}
  .info-card h3{font-size:10px;margin-bottom:8px;letter-spacing:.13em}
  .info-card h3 i{font-size:11px}
  .info-card table{font-size:11.5px}
  .info-card td{padding:6px 0}
  .info-card td:first-child{padding-right:8px;width:40%}
  .info-card td:last-child{width:60%}
  .modal{padding:20px;border-radius:18px}
  .modal h2{font-size:15px;margin-bottom:16px}
  .modal > h3{margin:14px 0 8px}
  .form-group{margin-bottom:12px}
  .form-group input,.form-group select{padding:9px 11px;font-size:12px}
  .btn-group button{padding:9px 17px;font-size:12px}
  .toast{bottom:16px;font-size:11.5px;padding:9px 14px;border-radius:10px}
}
@media(max-width:380px){
  :root{--chart-h:160px}
  .card .value{font-size:clamp(17px,5vw,21px)}
  .status-bar{font-size:10px}
  .status-bar > span{padding:4px 8px}
  .header-actions button{font-size:13px;padding:5px 7px}
  .theme-toggle{width:30px;height:30px!important}
  .theme-toggle svg{width:14px;height:14px}
  .info-card table{font-size:11px}
  .info-card td:first-child{padding-right:6px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  <div class="header-weather" id="headerWeather"></div>

      <span><span class="dot offline" id="espStatusDot"></span> <span id="espStatus">ESP离线</span></span>

      <span><i class="far fa-clock"></i> <span id="lastUpdate">-</span></span>

<div class="container">
  <div class="cards" id="mainCards"></div>

  <!-- 趋势图卡片 -->
  <div class="chart-box" style="margin-bottom:20px">
    <h3><i class="fas fa-chart-line" style="color:var(--orange)"></i> 趋势</h3>
    <div class="trend-head">
      <div class="trend-left">
        <select id="trendDate" class="trend-date" title="选择日期"></select>
        <div class="winseg" id="winSeg" title="选择时间范围">
          <button class="on" data-win="1">1 小时</button>
          <button data-win="6">6 小时</button>
          <button data-win="12">12 小时</button>
          <button data-win="24">24 小时</button>
        </div>
      </div>
      <div class="trend-chips" id="metricChips">
        <button class="chip on" data-metric="pin"><i style="background:#ffb45c"></i>输入功率</button>
        <button class="chip" data-metric="pout"><i style="background:#a78bfa"></i>输出功率</button>
        <button class="chip" data-metric="iin"><i style="background:#42e8c6"></i>输入电流</button>
        <button class="chip" data-metric="iout"><i style="background:#ff6b7a"></i>输出电流</button>
        <button class="chip" data-metric="vin"><i style="background:#63a8ff"></i>输入电压</button>
        <button class="chip" data-metric="vout"><i style="background:#b8ff6a"></i>输出电压</button>
        <button class="chip" data-metric="both"><i style="background:linear-gradient(90deg,#ffb45c,#a78bfa)"></i>功率对比</button>
      </div>
    </div>
    <svg class="trend-svg" id="trendSvg" viewBox="0 0 1000 300" preserveAspectRatio="xMidYMid meet" role="img" aria-label="所选时间范围内的功率与电流趋势曲线"></svg>
    <div class="trend-stats" id="trendStats"></div>
  </div>

  <!-- 月度图卡片 -->
  <div class="chart-box" style="margin-bottom:20px">
    <h3><i class="fas fa-calendar-alt" style="color:var(--violet)"></i> <span id="monthTitle">近 7 天每日发电量</span></h3>
    <div class="trend-head">
      <div class="trend-left">
        <button class="chip" onclick="openYearlyReport()" style="background:rgba(66,232,198,.15);color:var(--cyan);border-color:var(--cyan);margin-left:0">
          <i class="fas fa-chart-bar"></i> 年度发电账单
        </button>
      </div>
      <div class="trend-chips" id="monthChips">
        <button class="chip on" data-mstat="energy"><i style="background:#ffb45c"></i>发电量</button>
        <button class="chip" data-mstat="peak"><i style="background:#a78bfa"></i>峰值功率</button>
        <span class="chip-sep"></span>
        <button class="chip on" data-range="7">近 7 天</button>
        <button class="chip" data-range="30">近 30 天</button>
      </div>
    </div>
    <svg class="trend-svg" id="monthSvg" viewBox="0 0 1000 300" preserveAspectRatio="xMidYMid meet" role="img" aria-label="近 7 天或近 30 天的每日发电量柱状图"></svg>
    <div class="trend-stats" id="monthStats"></div>
  </div>

  <!-- 信息卡片区 -->
  <div class="info-grid" id="infoGrid"></div>
</div>

<div id="toast" class="toast"></div>

<!-- 登录模态框 -->
<div id="loginOverlay" class="overlay">
  <div class="modal modal-sm">
    <h2><i class="fas fa-lock"></i> 管理员登录</h2>
    <div class="form-group">
      <label>管理密码</label>
      <input id="loginPass" type="password" placeholder="请输入密码" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <div id="loginError" style="color:#ef4444;font-size:13px;margin-bottom:8px;display:none"></div>
    <div class="btn-group" style="justify-content:center">
      <button class="btn-primary" id="loginBtn" onclick="doLogin()" style="flex:1"><i class="fas fa-unlock"></i> 登录</button>
      <button class="btn-secondary" onclick="closeLogin()">取消</button>
    </div>
  </div>
</div>

<!-- 设置模态框 -->
<div id="settingsOverlay" class="overlay">
  <div class="modal">
    <h2><i class="fas fa-cog"></i> 连接设置</h2>
    <h3><i class="fas fa-microchip"></i> ESP32 设备</h3>
    <div class="form-group">
      <label>设备地址</label>
      <input id="cfgEsp32Url" placeholder="http://192.168.1.100:80">
      <div class="form-hint">完整的 URL，包含端口</div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>用户名</label><input id="cfgEsp32User" placeholder="admin"></div>
      <div class="form-group"><label>密码</label><input id="cfgEsp32Pass" type="password" placeholder="admin"></div>
    </div>
    <div class="form-group">
      <button id="testEspBtn" class="btn-secondary" onclick="testESP32()"><i class="fas fa-plug"></i> 测试连接</button>
      <div id="testEspResult" class="test-result"></div>
    </div>
    
    <h3><i class="fas fa-server"></i> MQTT 服务器</h3>
    <div class="form-group">
      <label>服务器地址</label>
      <input id="cfgMqttUrl" placeholder="mqtt://192.168.1.100:1883">
      <div class="form-hint">mqtt://ip:port 或 mqtts://...</div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>用户名</label><input id="cfgMqttUser" placeholder="mqtt"></div>
      <div class="form-group"><label>密码</label><input id="cfgMqttPass" type="password" placeholder="your_mqtt_password"></div>
    </div>
    <div class="form-group">
      <label>状态主题</label>
      <input id="cfgStateTopic" placeholder="mppt/status">
      <div class="form-hint">HA 读取此主题获取数据</div>
    </div>
    <div class="form-group">
      <label>轮询间隔（毫秒）</label>
      <input id="cfgInterval" type="number" placeholder="1000" min="1000">
      <div class="form-hint">建议 1000-5000ms</div>
    </div>
    <div class="form-group">
      <button id="testMqttBtn" class="btn-secondary" onclick="testMQTT()"><i class="fas fa-plug"></i> 测试连接</button>
      <div id="testMqttResult" class="test-result"></div>
    </div>

    <h3><i class="fas fa-cloud-sun"></i> 天气显示</h3>
    <div class="form-group">
      <label>城市代码（中国天气网，可选）</label>
      <input id="cfgWeatherCity" placeholder="留空则不显示天气">
      <div class="form-hint">9 位数字代码，在中国天气网查询你的城市；留空关闭天气显示</div>
    </div>
    
    <h3><i class="fas fa-list"></i> 数据格式</h3>
    <div class="form-group">
      <label>CSV 字段格式</label>
      <select id="cfgCsvFormat">
        <option value="auto">自动识别（推荐）</option>
        <option value="standard">标准 27 字段</option>
        <option value="qingcai">青菜 26 字段</option>
      </select>
      <div class="form-hint">功率/电流明显不合理时手动切换</div>
    </div>
    
    <h3><i class="fas fa-key"></i> 管理密码</h3>
    <div class="form-group">
      <label>修改管理密码（留空不修改）</label>
      <input id="cfgAdminPass" type="password" placeholder="新密码">
    </div>

</div>

<script>
const $ = id => document.getElementById(id);
const METRICS = {
  pin: {label:'输入功率',unit:'W',color:'#ffb45c',dec:2},
  pout:{label:'输出功率',unit:'W',color:'#a78bfa',dec:2},
  iin: {label:'输入电流',unit:'A',color:'#42e8c6',dec:3},
  iout:{label:'输出电流',unit:'A',color:'#ff6b7a',dec:3},
  vin: {label:'输入电压',unit:'V',color:'#63a8ff',dec:2},
  vout:{label:'输出电压',unit:'V',color:'#b8ff6a',dec:2},
};
const pad2 = n => String(n).padStart(2,'0');
const num = v => { const n = Number(v); return Number.isFinite(n) ? n : null; };
const f1 = v => { const n = num(v); return n === null ? '--' : n.toFixed(1); };
const f2 = v => { const n = num(v); return n === null ? '--' : n.toFixed(2); };
function hhmm(h){ const t = Math.round(h*60); return pad2(Math.floor(t/60)%24)+':'+pad2(t%60); }
function bjNow(){ const d = new Date(Date.now()+8*3600000); return d.getUTCHours()+d.getUTCMinutes()/60+d.getUTCSeconds()/3600; }
function trendToday(){ return new Date(Date.now() + 8 * 3600000).toISOString().slice(0, 10); }

/* ══════════ 数据卡片 ══════════ */
const CARD_ITEMS = [
  { key:'vin', label:'输入电压', unit:'V', cls:'voltage', icon:'fa-solar-panel' },
  { key:'iin', label:'输入电流', unit:'A', cls:'current', icon:'fa-solar-panel' },
  { key:'pin', label:'输入功率', unit:'W', cls:'power', icon:'fa-solar-panel' },
  { key:'vout', label:'输出电压', unit:'V', cls:'voltage', icon:'fa-charging-station' },
  { key:'iout', label:'输出电流', unit:'A', cls:'current', icon:'fa-charging-station' },
  { key:'pout', label:'输出功率', unit:'W', cls:'power', icon:'fa-charging-station' },
  { key:'eff', label:'效率', unit:'%', cls:'measurement', icon:'fa-percent' },
  { key:'loop', label:'循环耗时', unit:'ms', cls:'measurement', icon:'fa-hourglass-half' },
  { key:'energy_daily', label:'今日发电量', unit:'kWh', cls:'energy', icon:'fa-sun', dec:3 },
  { key:'energy_yesterday', label:'昨日发电量', unit:'kWh', cls:'energy', icon:'fa-industry' },
  { key:'energy_total', label:'累计发电量', unit:'kWh', cls:'energy', icon:'fa-industry' },
  { key:'temp', label:'MOS温度', unit:'°C', cls:'temperature', icon:'fa-thermometer-half' },
  { key:'cpu_temp', label:'CPU温度', unit:'°C', cls:'temperature', icon:'fa-microchip' },
  { key:'fan', label:'风扇', unit:'', cls:'measurement', icon:'fa-fan', fn: v => v===1?'运行':'停止' },
];

let cardsBuilt = false;
const cardNumRefs = {};

function buildCards() {
  const wrap = $('mainCards');
  const frag = document.createDocumentFragment();
  for (let i = 0; i < CARD_ITEMS.length; i++) {
    const c = CARD_ITEMS[i];
    const card = document.createElement('div');
    card.className = 'card ' + c.cls;
    const label = document.createElement('div');
    label.className = 'label';
    const ic = document.createElement('i');
    ic.className = 'fas ' + c.icon;
    label.appendChild(ic);
    label.appendChild(document.createTextNode(' ' + c.label));
    const value = document.createElement('div');
    value.className = 'value';
    const numEl = document.createElement('span');
    numEl.className = 'num';
    numEl.textContent = '--';
    const unit = document.createElement('span');
    unit.className = 'unit';
    unit.textContent = c.unit;
    value.appendChild(numEl);
    value.appendChild(unit);
    card.appendChild(label);
    card.appendChild(value);
    frag.appendChild(card);
    cardNumRefs[c.key] = numEl;
  }
  wrap.appendChild(frag);
  cardsBuilt = true;
}

function updateCards(d) {
  if (!cardsBuilt) buildCards();
  for (let i = 0; i < CARD_ITEMS.length; i++) {
    const c = CARD_ITEMS[i];
    const v = d[c.key];
    let display;
    if (v === null || v === undefined || v === '') display = '--';
    else if (c.fn) display = c.fn(v);
    else if (typeof v === 'number') display = v.toFixed(c.dec !== undefined ? c.dec : 2);
    else display = String(v);
    const el = cardNumRefs[c.key];
    if (el && el.textContent !== display) el.textContent = display;
  }
}

/* ══════════ 信息卡片 ══════════ */
const INFO_HTML = [
  '<div class="info-card">',
    '<h3><span><i class="fas fa-microchip"></i> 系统状态</span>',
    '<button onclick="restartESP()"><i class="fas fa-power-off"></i> 重启</button></h3>',
    '<table>',
      '<tr><td>状态</td><td data-k="err"></td></tr>',
      '<tr><td>错误信息</td><td data-k="err_msg"></td></tr>',
      '<tr><td>充电状态</td><td data-k="chg"></td></tr>',
      '<tr><td>风扇</td><td data-k="fan"></td></tr>',
      '<tr><td>旁路</td><td data-k="bypass"></td></tr>',
      '<tr><td>重启原因</td><td data-k="reset"></td></tr>',
    '</table>',
  '</div>',
  '<div class="info-card">',
    '<h3><span><i class="fas fa-chart-line"></i> 电能统计</span></h3>',
    '<table>',
      '<tr><td>本次累计</td><td data-k="wh"></td></tr>',
      '<tr><td>总累计</td><td data-k="twh"></td></tr>',
      '<tr><td>最大输入电压</td><td data-k="vin_max"></td></tr>',
      '<tr><td>循环耗时</td><td data-k="loop"></td></tr>',
      '<tr><td>运行时长</td><td data-k="elapsed"></td></tr>',
      '<tr><td>设备地址</td><td data-k="addr"></td></tr>',
      '<tr><td>服务运行时长</td><td data-k="backend_uptime"></td></tr>', // [新增]
    '</table>',
  '</div>',
  '<div class="info-card">',
    '<h3><span><i class="fas fa-sun"></i> MPPT</span></h3>',
    '<table>',
      '<tr><td>今日发电量</td><td data-k="e_daily"></td></tr>',
      '<tr><td>昨日发电量</td><td data-k="e_yesterday"></td></tr>',
      '<tr><td>累计发电量</td><td data-k="e_total"></td></tr>',
      '<tr><td>CPU温度</td><td data-k="cpu_temp"></td></tr>',
      '<tr><td>PWM</td><td data-k="pwm"></td></tr>',
      '<tr><td>PPWM</td><td data-k="ppwm"></td></tr>',
      '<tr><td>MPPT日志</td><td data-k="mppt_log"></td></tr>',
    '</table>',
  '</div>'
].join('');

let infoBuilt = false;
const infoRefs = {};
function buildInfo() {
  const wrap = $('infoGrid');
  wrap.innerHTML = INFO_HTML;
  const nodes = wrap.querySelectorAll('[data-k]');
  for (let i = 0; i < nodes.length; i++) infoRefs[nodes[i].getAttribute('data-k')] = nodes[i];
  infoBuilt = true;
}
function setText(k, text) { const el = infoRefs[k]; if (el && el.textContent !== text) el.textContent = text; }
function setHTML(k, html) { const el = infoRefs[k]; if (el && el._html !== html) { el._html = html; el.innerHTML = html; } }
function fmtElapsed(e) {
  if (!e) return '-';
  const p = String(e).split(':');
  const h = parseInt(p[0], 10) || 0;
  const d = Math.floor(h / 24);
  const hh = String(h % 24).padStart(2, '0');
  return d > 0 ? (d + '天 ' + hh + ':' + (p[1]||'00') + ':' + (p[2]||'00')) : String(e);
}
function updateInfo(d) {
  if (!infoBuilt) buildInfo();
  setHTML('err', d.err === 0 ? '<span class="badge ok">正常</span>' : '<span class="badge err">错误 #' + d.err + '</span>');
  setText('err_msg', d.err_msg || '-');
  let chg;
  if (d.err !== 0 || d.buck === 0) chg = '<span class="badge err">充电停止</span>';
  else if (d.chg === 1) chg = '<span class="badge off">充电完成</span>';
  else chg = '<span class="badge ok">充电中</span>';
  setHTML('chg', chg);
  setHTML('fan', d.fan === 1 ? '<span class="badge on"><i class="fas fa-fan"></i> 运行</span>' : '<span class="badge off">停止</span>');
  setHTML('bypass', d.bypass === 1 ? '<span class="badge on">打开</span>' : '<span class="badge off">关闭</span>');
  setText('reset', d.reset == null ? '-' : String(d.reset));

  // 硬件原生电量读取
  setText('wh',      (num(d.wh)  !== null ? (num(d.wh)  / 1000).toFixed(3) : '0.000') + ' kWh');
  setText('twh',     (num(d.twh) !== null ? (num(d.twh) / 1000).toFixed(3) : '0.000') + ' kWh');
  setText('vin_max', (Number(d.vin_max) || 0).toFixed(2) + ' V');
  setText('loop',    (Number(d.loop)    || 0).toFixed(2) + ' ms');
  setText('elapsed', fmtElapsed(d.elapsed));
  setText('addr',    d._esp32Url ? String(d._esp32Url).replace(/^https?:\/\//,'').replace(/\/$/,'') : '-');

  // [新增] 后端服务运行时长
  if (d._uptime !== undefined && d._uptime !== null) {
    const secs = Number(d._uptime);
    const days = Math.floor(secs / 86400);
    const hours = Math.floor((secs % 86400) / 3600);
    const mins = Math.floor((secs % 3600) / 60);
    let uptimeStr = '';
    if (days > 0) uptimeStr += days + '天 ';
    uptimeStr += hours + '小时 ' + mins + '分';
    setText('backend_uptime', uptimeStr);
  } else {
    setText('backend_uptime', '-');
  }

  setText('e_daily', (Number(d.energy_daily) || 0).toFixed(3) + ' kWh');
  setText('e_yesterday', (Number(d.energy_yesterday) || 0).toFixed(3) + ' kWh');
  setText('e_total', (Number(d.energy_total) || 0).toFixed(3) + ' kWh');
  setText('cpu_temp', (Number(d.cpu_temp) || 0).toFixed(1) + ' °C');
  setText('pwm', String(d.pwm || 0));
  setText('ppwm', String(d.ppwm || 0));
  setText('mppt_log', d.mppt_log || '-');
}

/* ══════════ 天气 ══════════ */
function weatherIcon(t) {
  if (!t) return 'fa-cloud';
  if (t.includes('雷')) return 'fa-cloud-bolt';
  if (t.includes('晴')) return 'fa-sun';
  if (t.includes('多云')) return 'fa-cloud-sun';
  if (t.includes('雨')) return 'fa-cloud-rain';
  if (t.includes('雪')) return 'fa-snowflake';
  if (t.includes('雾')) return 'fa-smog';
  if (t.includes('风')) return 'fa-wind';
  return 'fa-cloud';
}
let lastWeatherKey = null;
function renderWeather(d) {
  const w = d._weather;
  const key = w ? JSON.stringify(w) : '';
  if (key === lastWeatherKey) return;
  lastWeatherKey = key;
  const el = $('headerWeather');
  if (!w || !w.weather) {
    el.className = 'header-weather off';
    el.innerHTML = '<i class="fas fa-cloud" style="color:#64748b;font-size:15px"></i><span style="color:#94a3b8">天气暂无</span>';
    return;
  }
  const day = (w.date || '').match(/\((.+?)\)/);
  const sub = [w.humidity, w.windDir + w.windLevel, [w.time, day ? day[1] : ''].filter(Boolean).join(' ')].filter(Boolean).join(' · ');
  el.className = 'header-weather';
  el.innerHTML = '<i class="fas ' + weatherIcon(w.weather) + ' weather-icon"></i>' +
    '<span class="weather-text">' + w.weather + '</span>' +
    '<span class="weather-temp">' + w.temp + '°C</span>' +
    '<span class="weather-sub">' + sub + '</span>';
}

/* ══════════ 趋势图 ══════════ */
let histPoints = [], histPeaks = {}, histDate = '', curMetric = 'pin', curDay = '', curWin = 1; // 默认选中1小时
function hourOf(t){ return ((Number(t)/3600000 + 8) % 24 + 24) % 24; }
function hhmmToHour(v){ const m = /^(\d{1,2}):(\d{2})$/.exec(String(v||'')); return m ? Number(m[1])+Number(m[2])/60 : null; }
function seriesFor(k){
  return histPoints.map(p => ({ h: hourOf(p.t), v: Number(p[k]), mx: Number(p[k+'Max']), ms: Number(p.ms)||60000 }))
    .filter(p => Number.isFinite(p.h) && Number.isFinite(p.v)).sort((a,b) => a.h-b.h);
}
function peakFor(k){
  const pk = histPeaks[k];
  if (pk && Number.isFinite(Number(pk.value))) { const h = hhmmToHour(pk.at); if (h !== null) return { v:Number(pk.value), h }; }
  const pts = seriesFor(k);
  return pts.reduce((a,p) => { const v = Number.isFinite(p.mx) ? Math.max(p.v,p.mx) : p.v; return (!a || v > a.v) ? { v, h:p.h } : a; }, null);
}
function niceMax(v){
  if (!(v > 0)) return 1;
  const raw = v*1.12, mag = Math.pow(10, Math.floor(Math.log10(raw))), n = raw/mag;
  const step = n<=1?1:n<=1.5?1.5:n<=2?2:n<=2.5?2.5:n<=3?3:n<=4?4:n<=5?5:n<=6?6:n<=8?8:10;
  return step*mag;
}
function niceStep(v){
  if (!(v > 0)) return 1;
  const mag = Math.pow(10, Math.floor(Math.log10(v))), n = v / mag;
  const s = n <= 1 ? 1 : n <= 1.5 ? 1.5 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10;
  return s * mag;
}
function trendRange(isToday){
  if (curWin >= 24) return { h0: 0, h1: 24 };
  const nowH = bjNow();
  let end;
  if (isToday) end = nowH;
  else {
    const last = histPoints.length ? histPoints[histPoints.length - 1] : null;
    end = last ? hourOf(last.t) + (Number(last.ms) || 60000) / 3600000 : 24;
  }
  end = Math.min(24, Math.max(0, end));
  const span = Math.max(1 / 60, Math.min(curWin, end));
  return { h0: Math.max(0, end - span), h1: end };
}
function axisStep(sp){ return sp > 12 ? 3 : sp > 6 ? 2 : sp > 3 ? 1 : sp > 1.5 ? 0.5 : sp > 0.8 ? 0.25 : sp > 0.4 ? 0.2 : 0.1; }
function peakIn(pts){ return pts.reduce((a, p) => { const v = Number.isFinite(p.mx) ? Math.max(p.v, p.mx) : p.v; return (!a || v > a.v) ? { v, h: p.h } : a; }, null); }

function drawTrend(k){
  const svg = $('trendSvg'), stats = $('trendStats');
  if (!svg) return;
  const both = k === 'both', keys = both ? ['pin','pout'] : [k], main = METRICS[keys[0]];
  const isToday = !histDate || histDate === trendToday();
  const rg = trendRange(isToday), h0 = rg.h0, h1 = rg.h1;
  const full = curWin >= 24;
  const scope = full ? (isToday ? '今日' : '当日') : '区间';
  const emptyStats = (scopeName) =>
    '<div class="tstat" style="--c:#64748b"><div class="k">' + scopeName + '峰值</div><div class="v">--</div></div>' +
    '<div class="tstat" style="--c:#64748b"><div class="k">平均</div><div class="v">--</div></div>' +
    '<div class="tstat" style="--c:#64748b"><div class="k">' + scopeName + '发电量</div><div class="v">--</div></div>' +
    '<div class="tstat" style="--c:#64748b"><div class="k">有效发电时长</div><div class="v">--</div></div>';
  if (!histPoints.length) {
    svg.innerHTML = '<text class="empty-hint" x="500" y="150" text-anchor="middle">' + (isToday ? '暂无今日数据' : '这天没有记录') + '</text>';
    stats.innerHTML = emptyStats(scope);
    return;
  }
  const inWin = p => p.h >= h0 - 1e-9 && p.h <= h1 + 1e-9;
  const ptsMap = {}; keys.forEach(x => ptsMap[x] = seriesFor(x).filter(inWin));
  const outWin = seriesFor('pout').filter(inWin); // 仅用于算发电量
  
  // 只取当前选中指标的数值来计算 Y 轴，防止被其他大数值压扁
  const pk = peakIn(ptsMap[keys[0]] || []);
  const allVals = keys.flatMap(x => ptsMap[x].map(p => p.v));
  let baseMax = allVals.length ? Math.max.apply(null, allVals) : 0;
  if (pk && pk.v > baseMax) baseMax = pk.v;
  if (baseMax <= 0) {
    baseMax = main.unit === 'A' ? 5 : (main.unit === 'V' ? 50 : 100);
  }
  const yMax = niceMax(baseMax);

  const cw = Math.round(svg.clientWidth || 0) || 1000;
  const narrow = cw < 620;
  const VW = narrow ? cw : 1000, VH = narrow ? 260 : 300;
  if (svg.getAttribute('viewBox') !== '0 0 ' + VW + ' ' + VH) svg.setAttribute('viewBox', '0 0 ' + VW + ' ' + VH);
  const L = narrow ? 42 : 70, R = VW - (narrow ? 12 : 28);
  const T = narrow ? 22 : 24, B = narrow ? VH - 46 : 246;
  const X = h => L + ((h - h0) / (h1 - h0)) * (R - L);
  const Y = v => B - (v / yMax) * (B - T);
  const f = n => n.toFixed(1), o = [];

  const avgPts = ptsMap[keys[0]] || [];
  const avgV = avgPts.length ? avgPts.reduce((a, p) => a + p.v, 0) / avgPts.length : 0;
  const kwh = outWin.reduce((a, p) => a + p.v * p.ms / 3600000 / 1000, 0);
  const effMin = Math.round(outWin.filter(p => p.v > 20).reduce((a, p) => a + p.ms / 60000, 0));
  stats.innerHTML =
    '<div class="tstat" style="--c:' + main.color + '"><div class="k">' + scope + '峰值 · ' + main.label + '</div><div class="v">' +
      (pk ? pk.v.toFixed(main.dec) : '--') + '<small>' + main.unit + ' · ' + (pk ? hhmm(pk.h) : '--') + '</small></div></div>' +
    '<div class="tstat" style="--c:#63a8ff"><div class="k">平均 · ' + main.label + '</div><div class="v">' +
      avgV.toFixed(main.dec) + '<small>' + main.unit + '</small></div></div>' +
    '<div class="tstat" style="--c:#42e8c6"><div class="k">' + scope + '发电量</div><div class="v">' +
      kwh.toFixed(3) + '<small>kWh</small></div></div>' +
    '<div class="tstat" style="--c:#a78bfa"><div class="k">有效发电时长</div><div class="v">' +
      Math.floor(effMin / 60) + '<small>h</small> ' + (effMin % 60) + '<small>m</small></div></div>';

  o.push('<defs>' + keys.map(x => '<linearGradient id="grad_' + x + '" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="' + METRICS[x].color + '" stop-opacity=".42"/><stop offset="100%" stop-color="' + METRICS[x].color + '" stop-opacity="0"/></linearGradient>').join('') + '</defs>');
  if (full) o.push('<rect x="' + f(X(10.5)) + '" y="' + T + '" width="' + f(X(14.5) - X(10.5)) + '" height="' + (B - T) + '" fill="' + main.color + '" opacity=".055"/>');
  const nowH = bjNow();
  if (full && isToday) o.push('<rect class="future" x="' + f(X(nowH)) + '" y="' + T + '" width="' + f(Math.max(0, R - X(nowH))) + '" height="' + (B - T) + '"/>');
  for (let i = 0; i <= 4; i++) {
    const v = yMax * i / 4, y = Y(v);
    o.push('<line class="gridln" x1="' + L + '" y1="' + f(y) + '" x2="' + R + '" y2="' + f(y) + '"/>');
    o.push('<text class="ax" x="' + (L - (narrow ? 7 : 10)) + '" y="' + f(y + 4.5) + '" text-anchor="end">' + (yMax >= 10 ? v.toFixed(0) : v.toFixed(1)) + '</text>');
  }
  const stepH = axisStep(h1 - h0) * (narrow && (h1 - h0) > 12 ? 2 : 1);
  const denseLabel = (h1 - h0) <= 3;
  const tickLabel = h => (denseLabel || Math.abs(h % 1) > 1e-9) ? hhmm(h) : pad2(h) + ':00';
  const drawTick = (h, alignEnd) => {
    const tx = Math.min(R, Math.max(L, X(h)));
    const anchor = alignEnd || tx > R - 16 ? 'end' : (tx < L + 16 ? 'start' : 'middle');
    o.push('<line class="gridln" x1="' + f(tx) + '" y1="' + B + '" x2="' + f(tx) + '" y2="' + (B + 6) + '"/>');
    o.push('<text class="ax" x="' + f(tx) + '" y="' + (B + 24) + '" text-anchor="' + anchor + '">' + tickLabel(h) + '</text>');
  };
  let lastTickH = null;
  for (let h = Math.ceil((h0 - 1e-9) / stepH) * stepH; h <= h1 + 1e-9; h += stepH) {
    if (h < h0 - 1e-9) continue;
    lastTickH = Math.round(h * 1000) / 1000;
    drawTick(lastTickH, false);
  }
  if (lastTickH === null || X(lastTickH) < R - (R - L) * 0.07) drawTick(h1, true);
  o.push('<line class="gridln" x1="' + L + '" y1="' + T + '" x2="' + L + '" y2="' + B + '" stroke-width="1.5"/>');

  let drew = false;
  keys.forEach(x => {
    const pts = ptsMap[x], c = METRICS[x].color;
    if (!pts.length) return;
    drew = true;
    const d = pts.map((p, i) => (i ? 'L' : 'M') + f(X(p.h)) + ' ' + f(Y(p.v))).join(' ');
    const area = d + ' L ' + f(X(pts[pts.length - 1].h)) + ' ' + B + ' L ' + f(X(pts[0].h)) + ' ' + B + ' Z';
    o.push('<path d="' + area + '" fill="url(#grad_' + x + ')" opacity="' + (both ? '.6' : '1') + '"/>');
    o.push('<path d="' + d + '" fill="none" stroke="' + c + '" stroke-width="' + (both ? '2.6' : '3') + '" stroke-linejoin="round" stroke-linecap="round"/>');
    if (pts.length === 1) o.push('<circle cx="' + f(X(pts[0].h)) + '" cy="' + f(Y(pts[0].v)) + '" r="4" fill="' + c + '"/>');
  });
  if (!drew) o.push('<text class="empty-hint" x="' + f((L + R) / 2) + '" y="' + f((T + B) / 2) + '" text-anchor="middle">这个时间段没有采样</text>');
  if (!both && pk && drew) {
    const px = X(pk.h), py = Y(pk.v);
    o.push('<g class="pkmark">');
    o.push('<line x1="' + f(px) + '" y1="' + f(py) + '" x2="' + f(px) + '" y2="' + B + '" stroke="' + main.color + '" stroke-width="1.6" stroke-dasharray="5 5" opacity=".75"/>');
    o.push('<circle cx="' + f(px) + '" cy="' + f(py) + '" r="6" fill="' + main.color + '" stroke="#fff" stroke-width="2.5"/>');
    const label = '峰值 ' + pk.v.toFixed(main.dec) + ' ' + main.unit + ' · ' + hhmm(pk.h);
    // 强制把气泡往上推 60 像素，但不超出顶部边界
// 水平方向：放在圆点右侧 15px 处，并防止超出右边界
let bx = px + 15;
if (bx + 216 > R) bx = px - 216 - 15; // 如果右边放不下，自动切到左边
bx = Math.max(L + 5, bx); // 防止超出左边界

// 垂直方向：让气泡和圆点垂直居中对齐，并防止超出上下边界
let by = py - 14;
if (by < T + 5) by = T + 5;
if (by + 28 > B) by = B - 28;
    o.push('<rect class="pkbox" x="' + f(bx) + '" y="' + f(by) + '" width="216" height="28" rx="8"/>');
    o.push('<text class="axb" x="' + f(bx + 108) + '" y="' + f(by + 19) + '" text-anchor="middle" style="fill:' + main.color + '">' + label + '</text>');
    o.push('</g>');
  }
//  if (isToday && nowH >= h0 && nowH <= h1) {
//    o.push('<line x1="' + f(X(nowH)) + '" y1="' + T + '" x2="' + f(X(nowH)) + '" y2="' + B + '" stroke="#f59e0b" stroke-width="1.6" opacity=".85"/>');
//    o.push('<text class="axb" x="' + f(Math.min(X(nowH) + 7, R - 92)) + '" y="' + (B - 9) + '" style="fill:#d97706">现在 ' + hhmm(nowH) + '</text>');
//  }
  if (!narrow || keys.length > 1) {
    keys.forEach((x, i) => {
      const gx = narrow ? L + 2 : R - 166, gy = T + (narrow ? 2 : 10) + i * 18;
      o.push('<rect x="' + gx + '" y="' + gy + '" width="12" height="9" rx="2" fill="' + METRICS[x].color + '"/>');
      o.push('<text class="ax" x="' + (gx + 19) + '" y="' + (gy + 9) + '">' + METRICS[x].label + ' ' + METRICS[x].unit + '</text>');
    });
  }
  svg.innerHTML = o.join('') + '<g id="trendHover" pointer-events="none"></g>';
  trendGeo = { L, R, T, B, keys, ptsMap, X, Y, h0, h1, VW, VH, narrow };
  if (!svg._hvBound) {
    svg._hvBound = true;
    svg.addEventListener('pointermove', trendHover);
    svg.addEventListener('pointerdown', trendHover);
    svg.addEventListener('pointerleave', clearTrendHover);
    svg.addEventListener('pointercancel', clearTrendHover);
  }
}
let trendGeo = null;
function clearTrendHover(){
  const g = document.getElementById('trendHover'); if (g) g.innerHTML = '';
  const svg = $('trendSvg'); if (svg) svg.classList.remove('hovering');
}
function trendHover(ev){
  const svg = $('trendSvg'); if (!svg || !trendGeo) return;
  const g = svg.querySelector('#trendHover'); if (!g) return;
  const rect = svg.getBoundingClientRect(); if (!rect.width) return;
  const { L, R, T, B, keys, ptsMap, X, Y, h0, h1 } = trendGeo;
  const VW = trendGeo.VW || 1000, VH = trendGeo.VH || 300;
  const sc = Math.min(rect.width / VW, rect.height / VH) || 1;
  const ox = (rect.width - VW * sc) / 2, oy = (rect.height - VH * sc) / 2;
  const mx = (ev.clientX - rect.left - ox) / sc;
  const my = (ev.clientY - rect.top - oy) / sc;
  if (mx < L - 8 || mx > R + 8) { g.innerHTML = ''; svg.classList.remove('hovering'); return; }
  const h = Math.max(h0, Math.min(h1, h0 + (mx - L) / (R - L) * (h1 - h0)));
  const near = [];
  for (const k of keys) {
    const pts = ptsMap[k]; if (!pts || !pts.length) continue;
    let best = pts[0], bd = Math.abs(pts[0].h - h);
    for (const p of pts) { const d = Math.abs(p.h - h); if (d < bd) { bd = d; best = p; } }
    near.push({ k, p: best });
  }
  if (!near.length) { g.innerHTML = ''; svg.classList.remove('hovering'); return; }
  const hh = near[0].p.h, cx = X(hh);
  let s = '<line x1="' + cx.toFixed(1) + '" y1="' + T + '" x2="' + cx.toFixed(1) + '" y2="' + B + '" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 4" opacity=".85"/>';
  for (const n of near) s += '<circle cx="' + X(n.p.h).toFixed(1) + '" cy="' + Y(n.p.v).toFixed(1) + '" r="5.5" fill="' + METRICS[n.k].color + '" stroke="#fff" stroke-width="2.5"/>';
  const lines = [hhmm(hh)];
  for (const n of near) lines.push(METRICS[n.k].label + ' ' + n.p.v.toFixed(METRICS[n.k].dec) + ' ' + METRICS[n.k].unit);
  const tw = t => Array.from(t).reduce((a, ch) => a + (/[\u4e00-\u9fa5]/.test(ch) ? 12.8 : 7.2), 0);
  const bw = Math.min(trendGeo.narrow ? VW - 24 : 300, Math.max.apply(null, lines.map(tw)) + 24);
  const bh = lines.length * 17 + 14;
  let bx = cx + 16;
  if (bx + bw > R + 4) bx = cx - 16 - bw;
  bx = Math.max(L + 2, bx);
  const by = (my > (T + B) / 2) ? T + 6 : Math.min(B - bh - 4, T + 6);
  s += '<rect class="hvbox" x="' + bx.toFixed(1) + '" y="' + by.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + bh + '" rx="9"/>';
  lines.forEach((t, i) => { s += '<text class="hvtx' + (i === 0 ? ' hvtime' : '') + '" x="' + (bx + 12).toFixed(1) + '" y="' + (by + 21 + i * 17).toFixed(1) + '">' + t + '</text>'; });
  g.innerHTML = s;
  svg.classList.add('hovering');
}

/* ══════════ 月度柱状图 ══════════ */
let monthDays = [], monthStats = null, curMStat = 'energy', monthGeo = null, curRange = 7;
const MSTAT = {
  energy: { label: '发电量', unit: 'kWh', dec: 2, color: '#ffb45c' },
  peak:   { label: '峰值功率', unit: 'W', dec: 0, color: '#a78bfa' },
};
function mval(d, m){ return m === 'peak' ? (Number(d.peakW) || 0) : (Number(d.energyKwh) || 0); }

let longTermStats = {};
async function fetchMonthly(){
  try {
    const r = await fetch('/api/monthly?days=' + curRange);
    const j = await r.json();
    if (!j.ok) return;
    monthDays = Array.isArray(j.days) ? j.days : [];
    monthStats = j.stats || null;
    longTermStats = j.longTerm || {}; // 接收年度账单数据
    drawMonth(curMStat);
  } catch (e) { console.warn('[月统计] 拉取失败', e.message); }
}

function drawMonth(m){
  const svg = $('monthSvg'), stats = $('monthStats');
  if (!svg) return;
  const cf = MSTAT[m] || MSTAT.energy, n = monthDays.length;
  const nDays = n || curRange;
  const ttl = $('monthTitle');
  if (ttl) ttl.textContent = '近 ' + nDays + ' 天每日发电量';
  if (!n) {
    svg.innerHTML = '<text class="empty-hint" x="500" y="150" text-anchor="middle">暂无数据</text>';
    if (stats) stats.innerHTML = '';
    return;
  }
  const cw = Math.round(svg.clientWidth || 0) || 1000;
  const narrow = cw < 560;
  const VW = narrow ? cw : 1000, VH = narrow ? 340 : 300;
  const L = narrow ? 40 : 60, R = VW - (narrow ? 8 : 24);
  const T = narrow ? 26 : 30, B = narrow ? VH - 44 : VH - 68;
  if (svg.getAttribute('viewBox') !== '0 0 ' + VW + ' ' + VH) svg.setAttribute('viewBox', '0 0 ' + VW + ' ' + VH);
  const slot = (R - L) / n;
  const bwMax = n <= 10 ? (narrow ? 22 : 38) : (narrow ? 13 : 24);
  const bw = Math.max(4, Math.min(bwMax, slot * (narrow ? 0.72 : 0.6)));
  const vals = monthDays.map(d => mval(d, m));
  const seg = 4;
  const step = niceStep(Math.max.apply(null, vals.concat([0])) / seg);
  const yMax = step * seg;
  const yDec = step >= 1 ? (Number.isInteger(step) ? 0 : 1) : 2;
  const Y = v => B - (v / yMax) * (B - T);
  const Xc = i => L + slot * i + slot / 2;
  const live = monthDays.filter(d => !d.empty);
  const avg = live.length ? live.reduce((a, d) => a + mval(d, m), 0) / live.length : 0;
  const f = x => x.toFixed(1), o = [];
  const today = monthDays[n - 1] && !monthDays[n - 1].empty ? n - 1 : -1;

  for (let i = 0; i <= seg; i++) {
    const v = step * i, y = Y(v);
    o.push('<line class="gridln" x1="' + L + '" y1="' + f(y) + '" x2="' + R + '" y2="' + f(y) + '"/>');
    o.push('<text class="ax" x="' + (L - 10) + '" y="' + f(y + 4.5) + '" text-anchor="end">' + v.toFixed(yDec) + '</text>');
  }
  o.push('<line class="gridln" x1="' + L + '" y1="' + T + '" x2="' + L + '" y2="' + B + '" stroke-width="1.5"/>');
  monthDays.forEach((d, i) => {
    const v = vals[i], x = Xc(i) - bw / 2, y = Y(v), h = Math.max(0, B - y);
    o.push('<g class="mbar" id="mb' + i + '" data-i="' + i + '">');
    if (d.empty || v <= 0) o.push('<rect class="mempty" x="' + f(x) + '" y="' + (B - 6) + '" width="' + f(bw) + '" height="6" rx="3"/>');
    else o.push('<rect x="' + f(x) + '" y="' + f(y) + '" width="' + f(bw) + '" height="' + f(h) + '" rx="3" fill="url(#mg_' + m + ')"' + (i === today ? ' class="mbar-today"' : '') + '/>');
    o.push('</g>');
  });
  if (avg > 0) {
    const ay = Y(avg);
    o.push('<line class="mavg" x1="' + L + '" y1="' + f(ay) + '" x2="' + R + '" y2="' + f(ay) + '"/>');
    if (!narrow) o.push('<text class="ax" x="' + (L + 4) + '" y="' + f(ay - 8) + '" style="fill:var(--muted)">日均 ' + avg.toFixed(cf.dec) + ' ' + cf.unit + '</text>');
  }
  let bi = -1;
  vals.forEach((v, i) => { if (!monthDays[i].empty && (bi < 0 || v > vals[bi])) bi = i; });
  const marks = [];
  if (bi >= 0) marks.push(bi);
  if (today >= 0 && (bi < 0 || Math.abs(today - bi) * slot >= 36)) marks.push(today);
  marks.forEach(i => {
    if (i < 0 || monthDays[i].empty) return;
    const v = vals[i], ty = Math.max(T + 12, Y(v) - 9);
    o.push('<text class="mvaltext" x="' + f(Xc(i)) + '" y="' + f(ty) + '" text-anchor="middle">' + v.toFixed(cf.dec) + '</text>');
  });
  const gap = n <= 10 ? 1 : (narrow ? 10 : 5);
  monthDays.forEach((d, i) => {
    if (i !== n - 1 && (n - 1 - i) % gap !== 0) return;
    const last = i === n - 1, edge = last && narrow;
    const lab = (narrow && n <= 10) ? d.date.slice(8) : d.date.slice(5);
    o.push('<text class="' + (last ? 'axb' : 'ax') + '" x="' + f(edge ? R : Xc(i)) + '" y="' + (B + (narrow ? 18 : 24)) + '" text-anchor="' + (edge ? 'end' : 'middle') + '">' + lab + '</text>');
  });
  if (!live.length) o.push('<text class="empty-hint" x="' + f((L + R) / 2) + '" y="' + f((T + B) / 2) + '" text-anchor="middle">暂无发电记录</text>');
  o.push('<text class="ax" x="' + (L - 10) + '" y="' + (T - 10) + '" text-anchor="end">' + cf.unit + '</text>');
  if (!narrow) o.push('<text class="ax" x="' + L + '" y="' + (VH - 8) + '">' + monthDays[0].date + ' 起 · 共 ' + n + ' 天</text>');
  o.unshift('<defs><linearGradient id="mg_energy" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffd08a"/><stop offset="100%" stop-color="#ffb45c"/></linearGradient>' +
    '<linearGradient id="mg_peak" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#c4b5fd"/><stop offset="100%" stop-color="#a78bfa"/></linearGradient></defs>');
  svg.classList.remove('hovering');
  svg.innerHTML = o.join('') + '<g id="monthHover" pointer-events="none"></g>';
  monthGeo = { L, R, T, B, n, slot, Xc, Y, m, yMax, VW, narrow };
  if (!svg._hvBound) {
    svg._hvBound = true;
    svg.addEventListener('pointermove', monthHover);
    svg.addEventListener('pointerleave', clearMonthHover);
    svg.addEventListener('pointercancel', clearMonthHover);
  }
  if (stats) {
    const st = monthStats || {};
    stats.innerHTML =
      '<div class="tstat" style="--c:#ffb45c"><div class="k">' + nDays + ' 天累计</div><div class="v">' + (st.totalKwh || 0).toFixed(2) + '<small>kWh</small></div></div>' +
      '<div class="tstat" style="--c:#63a8ff"><div class="k">日均发电</div><div class="v">' + (st.avgKwh || 0).toFixed(2) + '<small>kWh</small></div></div>' +
      '<div class="tstat" style="--c:#42e8c6"><div class="k">最高一天 · ' + (st.bestDate ? st.bestDate.slice(5) : '--') + '</div><div class="v">' + (st.bestKwh || 0).toFixed(2) + '<small>kWh</small></div></div>' +
      '<div class="tstat" style="--c:#a78bfa"><div class="k">' + nDays + ' 天最高功率</div><div class="v">' + (st.peakW || 0).toFixed(0) + '<small>W</small></div></div>';
  }
}
function clearMonthHover(){
  const svg = $('monthSvg'); if (!svg) return;
  const g = svg.querySelector('#monthHover'); if (g) g.innerHTML = '';

function monthHover(ev){

  const g = svg.querySelector('#monthHover'); if (!g) return;
  const rect = svg.getBoundingClientRect(); if (!rect.width) return;

  const d = monthDays[i]; if (!d) return;
  const cf = MSTAT[monthGeo.m] || MSTAT.energy;
  const v = mval(d, monthGeo.m), x = monthGeo.Xc(i), y = monthGeo.Y(v);
  const bwCol = Math.min(24, slot * 0.6);

  if (!d.empty) s += '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="5" fill="' + cf.color + '" stroke="#fff" stroke-width="2.5"/>';

  const tw = t => Array.from(t).reduce((a, ch) => a + (/[\u4e00-\u9fa5]/.test(ch) ? 12.8 : 7.2), 0);
  const bw = Math.min(monthGeo.narrow ? VW - 44 : 320, Math.max.apply(null, lines.map(tw)) + 24);
  const bh = lines.length * 17 + 14;
  let bx = x + 14; if (bx + bw > R + 6) bx = x - 14 - bw; bx = Math.max(L + 2, bx);
  const by = (my > (T + B) / 2) ? T + 2 : Math.min(B - bh - 2, T + 2);
  s += '<rect class="hvbox" x="' + bx.toFixed(1) + '" y="' + by.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + bh + '" rx="9"/>';
  lines.forEach((t, k) => { s += '<text class="hvtx' + (k === 0 ? ' hvtime' : '') + '" x="' + (bx + 12).toFixed(1) + '" y="' + (by + 21 + k * 17).toFixed(1) + '">' + t + '</text>'; });
  g.innerHTML = s;
  svg.classList.add('hovering');
  svg.querySelectorAll('.mbar').forEach(el => el.classList.toggle('dim', el.getAttribute('data-i') !== String(i)));

/* ══════════ 年度账单功能 ══════════ */
function openYearlyReport() {

function drawYearlyChart() {
  const year = document.getElementById('yearSelect').value;
  const svg = document.getElementById('yearlySvg');
  const W = 800, H = 300, L = 50, R = W - 20, T = 30, B = H - 40;
  const months = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  
  const vals = months.map((_, i) => {
    const key = `${year}-${String(i + 1).padStart(2, '0')}`;
    return parseFloat((longTermStats[key] || 0).toFixed(2));
  });

  const maxVal = Math.max(...vals, 10);
  const step = niceStep(maxVal / 4);
  const yMax = step * 4;
  const Y = v => B - (v / yMax) * (B - T);
  const slot = (R - L) / 12;
  const bw = slot * 0.6;
  const Xc = i => L + slot * i + slot / 2;
  
  const o = [];
  for (let i = 0; i <= 4; i++) {
    const v = step * i, y = Y(v);
    o.push(`<line x1="${L}" y1="${y}" x2="${R}" y2="${y}" stroke="var(--line)" stroke-dasharray="4 4"/>`);
    o.push(`<text x="${L-10}" y="${y+4}" fill="var(--muted)" font-size="12" text-anchor="end">${v.toFixed(0)}</text>`);
  }

  let total = 0, best = 0, bestMonth = '';
  vals.forEach((v, i) => {
    total += v;
    if (v > best) { best = v; bestMonth = months[i]; }
    const x = Xc(i) - bw / 2;
    const y = Y(v);
    const h = B - y;
    if (v > 0) {
      o.push(`<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="4" fill="url(#yearlyGrad)"/>`);
      o.push(`<text x="${Xc(i)}" y="${y-8}" fill="var(--orange)" font-size="12" font-weight="bold" text-anchor="middle">${v.toFixed(1)}</text>`);
    }
    o.push(`<text x="${Xc(i)}" y="${B+20}" fill="var(--muted)" font-size="12" text-anchor="middle">${months[i]}</text>`);
  });

  document.getElementById('yearTotal').innerHTML = total.toFixed(1) + '<small>kWh</small>';
  document.getElementById('yearBestMonth').innerHTML = bestMonth + ' ' + best.toFixed(1) + '<small>kWh</small>';
  document.getElementById('yearAvg').innerHTML = (total / 12).toFixed(1) + '<small>kWh</small>';

  o.unshift(`<defs><linearGradient id="yearlyGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="var(--orange)"/><stop offset="100%" stop-color="rgba(255,180,92,.1)"/></linearGradient></defs>`);
  svg.innerHTML = o.join('');
}

/* ══════════ 登录 / 设置 / 控制 ══════════ */
let authToken = sessionStorage.getItem('mppt_token') || '';
let tokenTime = parseInt(sessionStorage.getItem('mppt_token_time') || '0');
function isTokenValid() { return authToken && (Date.now() - tokenTime) < 86400000; }
function authFetch(url, options = {}) { options.headers = { ...options.headers, 'Authorization': 'Bearer ' + authToken }; return fetch(url, options); }
function showToast(msg, type) { const t = $('toast'); t.textContent = msg; t.className = 'toast ' + type + ' show'; setTimeout(() => t.classList.remove('show'), 3000); }
function openLogin() {
  if (isTokenValid()) { openSettings(); return; }
  $('loginPass').value = ''; $('loginError').style.display = 'none';
  $('loginBtn').disabled = false; $('loginBtn').innerHTML = '<i class="fas fa-unlock"></i> 登录';
  $('loginOverlay').classList.add('open'); $('loginPass').focus();
}
function closeLogin() { $('loginOverlay').classList.remove('open'); }
async function doLogin() {
  const pass = $('loginPass').value;
  if (!pass) { $('loginError').textContent = '请输入密码'; $('loginError').style.display = 'block'; return; }
  try {
    const r = await fetch('/api/login', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({password:pass}) });
    const d = await r.json();
    $('loginError').style.display = 'block';
    if (d.success) {
      authToken = d.token; tokenTime = Date.now();
      sessionStorage.setItem('mppt_token', authToken); sessionStorage.setItem('mppt_token_time', tokenTime.toString());
      $('loginError').style.display = 'none'; closeLogin(); openSettings();
    } else if (d.banned) {
      $('loginBtn').disabled = true; $('loginBtn').innerHTML = '<i class="fas fa-ban"></i> 永久封禁';
      $('loginError').textContent = '该IP已被永久封禁，刷新页面也无法解除';
    } else if (d.locked) {
      $('loginBtn').disabled = true; $('loginBtn').innerHTML = '<i class="fas fa-lock"></i> 已锁定(' + (d.waitMinutes || 15) + '分钟)';
      $('loginError').textContent = '密码错误次数过多，请' + (d.waitMinutes || 15) + '分钟后再试';
    } else {
      $('loginError').textContent = d.error || '密码错误';
    }
  } catch(e) { $('loginError').textContent = '连接失败'; $('loginError').style.display = 'block'; }
}
async function openSettings() {
  if (!isTokenValid()) { openLogin(); return; }
  try {
    const r = await authFetch('/api/settings');
    if (r.status === 401) { sessionStorage.removeItem('mppt_token'); authToken = ''; openLogin(); return; }
    const cfg = await r.json();
    $('cfgEsp32Url').value = cfg.esp32Url; $('cfgEsp32User').value = cfg.esp32User; $('cfgEsp32Pass').value = '****';
    $('cfgMqttUrl').value = cfg.mqttUrl; $('cfgMqttUser').value = cfg.mqttUser; $('cfgMqttPass').value = '****';
    $('cfgStateTopic').value = cfg.stateTopic; $('cfgInterval').value = cfg.interval;
    $('cfgWeatherCity').value = cfg.weatherCity || '';
    $('cfgCsvFormat').value = cfg.csvFormat || 'auto';
    $('cfgAdminPass').value = '';
    $('testEspResult').innerHTML = ''; $('testMqttResult').innerHTML = '';
    $('settingsOverlay').classList.add('open');
  } catch { showToast('加载设置失败', 'error'); }
}
function closeSettings() { $('settingsOverlay').classList.remove('open'); }
async function testESP32() {
  const btn = $('testEspBtn'); btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 测试中...';
  const res = $('testEspResult');
  try {
    const r = await authFetch('/api/test-esp32', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ url: $('cfgEsp32Url').value, user: $('cfgEsp32User').value, pass: $('cfgEsp32Pass').value === '****' ? '' : $('cfgEsp32Pass').value }) });
    const d = await r.json();
    res.innerHTML = d.success ? '<span class="test-result ok"><i class="fas fa-check-circle"></i> 连接成功 - 输入: '+d.data.vin+'V 输出: '+d.data.vout+'V 功率: '+d.data.pin+'W</span>'
      : '<span class="test-result fail"><i class="fas fa-times-circle"></i> '+d.error+'</span>';
  } catch(e) { res.innerHTML = '<span class="test-result fail"><i class="fas fa-times-circle"></i> '+e.message+'</span>'; }
  btn.disabled = false; btn.innerHTML = '<i class="fas fa-plug"></i> 测试连接';
}
async function testMQTT() {
  const btn = $('testMqttBtn'); btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 测试中...';
  const res = $('testMqttResult');
  try {
    const r = await authFetch('/api/test-mqtt', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ url: $('cfgMqttUrl').value, user: $('cfgMqttUser').value, pass: $('cfgMqttPass').value === '****' ? '' : $('cfgMqttPass').value }) });
    const d = await r.json();
    res.innerHTML = d.success ? '<span class="test-result ok"><i class="fas fa-check-circle"></i> MQTT 连接成功</span>'
      : '<span class="test-result fail"><i class="fas fa-times-circle"></i> '+d.error+'</span>';
  } catch(e) { res.innerHTML = '<span class="test-result fail"><i class="fas fa-times-circle"></i> '+e.message+'</span>'; }
  btn.disabled = false; btn.innerHTML = '<i class="fas fa-plug"></i> 测试连接';
}
async function saveSettings() {
  const body = {
    adminPassword: $('cfgAdminPass').value || '****',
    esp32Url: $('cfgEsp32Url').value, esp32User: $('cfgEsp32User').value, esp32Pass: $('cfgEsp32Pass').value,
    mqttUrl: $('cfgMqttUrl').value, mqttUser: $('cfgMqttUser').value, mqttPass: $('cfgMqttPass').value,
    stateTopic: $('cfgStateTopic').value, interval: parseInt($('cfgInterval').value) || 1000,
    weatherCity: $('cfgWeatherCity').value.trim(), csvFormat: $('cfgCsvFormat').value,
  };
  try {
    const r = await authFetch('/api/settings', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
    if (r.status === 401) { sessionStorage.removeItem('mppt_token'); authToken = ''; closeSettings(); openLogin(); return; }
    const d = await r.json();
    if (d.success) { showToast('配置已保存', 'success'); closeSettings(); }
    else showToast(d.message || '保存失败', 'error');
  } catch(e) { showToast('保存失败: '+e.message, 'error'); }
}
function restartESP() {
  if (!isTokenValid()) { showToast('请先登录', 'error'); openLogin(); return; }
  if (!confirm('确定重启 ESP32 吗？')) return;
  authFetch('/api/control', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({type:9, index:0, operation:2}) })
    .then(r => r.json()).then(d => { showToast(d.success ? '已发送重启命令' : '失败: '+d.error, d.success ? 'success' : 'error'); })
    .catch(() => showToast('请求失败', 'error'));
}

/* ══════════ SSE ══════════ */
function setDotState(dotId, textId, online, onText, offText) {
  const dot = $(dotId), txt = $(textId);
  const cls = 'dot ' + (online ? 'online' : 'offline');
  if (dot.className !== cls) dot.className = cls;
  const t = online ? onText : offText;
  if (txt.textContent !== t) txt.textContent = t;
}
function connectSSE() {
  const evtSource = new EventSource('/api/stream');
  evtSource.onmessage = e => {
    try {
      const d = JSON.parse(e.data);
      if (d._mqttReady !== undefined) setDotState('mqttDot', 'mqttStatus', !!d._mqttReady, 'MQTT在线', 'MQTT离线');
      if (d._esp32Online !== undefined) setDotState('espStatusDot', 'espStatus', !!d._esp32Online, 'ESP在线', 'ESP离线');
      if (d._weather !== undefined) renderWeather(d);
      if (d.vin === undefined) return;
      updateCards(d);
      updateInfo(d);
      const t = d.time || new Date().toLocaleString();
      const lu = $('lastUpdate');
      if (lu.textContent !== t) lu.textContent = t;
    } catch (err) {}
  };
}
