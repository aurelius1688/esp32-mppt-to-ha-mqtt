# ═══════════════════════════════════════════════════
# Home Assistant MQTT 传感器配置
# 将此内容添加到 configuration.yaml
# 桥接服务器会自动发送 MQTT 发现（推荐方式）
# 如需手动配置，取消下方注释
# ═══════════════════════════════════════════════════

# ── 1. 自动发现（推荐）─────────────────────────
# 桥接服务器会自动发布 discovery 消息到：
#   homeassistant/sensor/mppt_*/config
# HA 自动发现后无需手动配置
# 只需确保 mqtt 集成已配置：
#
# mqtt:
#   broker: 192.168.1.100
#   username: mqtt
#   password: your_mqtt_password

